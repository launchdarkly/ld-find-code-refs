name: Publish
description: >-
  Build every release artifact once with goreleaser, push the Docker images,
  upload the same artifacts to the GitHub release, optionally publish it, and
  push the Homebrew formula once the release is public.
inputs:
  tag:
    description: Release tag to upload artifacts to (vX.Y.Z). Must already be checked out.
    required: true
  dry-run:
    description: Build a snapshot without pushing images, the formula, or release assets.
    required: false
    default: 'true'
  publish-release:
    description: Un-draft the release after uploading artifacts.
    required: false
    default: 'false'
  token:
    description: Token used to upload release assets and publish the release.
    required: true
  homebrew-deploy-key:
    description: SSH deploy key for launchdarkly/homebrew-tap.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check out tag matches version
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # goreleaser names artifacts from the tag at HEAD; refuse to build anything else.
        head_tags=$(git tag --points-at HEAD)
        if ! grep -qx "$TAG" <<<"$head_tags"; then
          echo "::error::HEAD is not tagged $TAG (tags at HEAD: ${head_tags:-none})"
          exit 1
        fi
        version=$(sed -nE 's/^const Version = "([^"]+)".*/\1/p' internal/version/version.go)
        if [[ "v$version" != "$TAG" ]]; then
          echo "::error::internal/version/version.go is $version but tag is $TAG"
          exit 1
        fi

    - name: Log in to Docker Hub
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin

    - name: Write Homebrew deploy key
      shell: bash
      env:
        HOMEBREW_DEPLOY_KEY: ${{ inputs.homebrew-deploy-key }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
        # The formula template needs a path even when publishing is skipped.
        printf '%s\n' "$HOMEBREW_DEPLOY_KEY" > "$key_path"
        chmod 600 "$key_path"
        echo "HOMEBREW_KEY_PATH=$key_path" >> "$GITHUB_ENV"

    - name: Run goreleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: '~> v2'
        args: release --clean ${{ inputs.dry-run == 'true' && '--snapshot --skip=publish' || '' }}

    - name: Upload release artifacts
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        gh release upload "$TAG" ./dist/*.deb ./dist/*.rpm ./dist/*.tar.gz ./dist/*_checksums.txt --clobber

    - name: Publish release
      if: ${{ inputs.dry-run != 'true' && inputs.publish-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

    # Draft release assets are not publicly downloadable, so only point the
    # formula at them once the release is public.
    - name: Push Homebrew formula
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
          echo "::warning::$TAG is still a draft; not pushing the Homebrew formula. Re-run Manual Publish with publish_release once it is ready."
          exit 0
        fi
        mkdir -p ~/.ssh && ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
        export GIT_SSH_COMMAND="ssh -i $HOMEBREW_KEY_PATH -o IdentitiesOnly=yes"
        tap="$RUNNER_TEMP/homebrew-tap"
        git clone --depth 1 --branch main git@github.com:launchdarkly/homebrew-tap.git "$tap"
        cp dist/homebrew/Formula/ld-find-code-refs.rb "$tap/Formula/"
        cd "$tap"
        git config user.name "LaunchDarklyReleaseBot"
        git config user.email "launchdarklyreleasebot@launchdarkly.com"
        git add Formula/ld-find-code-refs.rb
        if git diff --cached --quiet; then
          echo "Homebrew formula already matches $TAG."
          exit 0
        fi
        git commit -m "Brew formula update for ld-find-code-refs version $TAG"
        git push origin main

    - name: Remove Homebrew deploy key
      if: ${{ always() }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/homebrew-tap-deploy-key"
